name: container

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images after tests pass
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install container and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq netcat-openbsd podman skopeo xxd

      - name: Install prek
        run: pipx install prek==0.5.0

      - name: Lint
        run: make lint

      - name: Resolve nfcapd content key
        id: nfcapd-meta
        env:
          TARGET_ARCH: amd64
        run: ./ci/content-key.sh nfcapd "${TARGET_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Resolve Samba content key
        id: samba-meta
        env:
          TARGET_ARCH: amd64
        run: ./ci/content-key.sh samba "${TARGET_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          NFCAPD_BASE_IMAGE: ${{ steps.nfcapd-meta.outputs.base_image }}
          NFCAPD_CONTENT_KEY: ${{ steps.nfcapd-meta.outputs.key }}
          SAMBA_BASE_IMAGE: ${{ steps.samba-meta.outputs.base_image }}
          SAMBA_CONTENT_KEY: ${{ steps.samba-meta.outputs.key }}
        run: make test
