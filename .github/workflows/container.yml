name: container

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images after tests pass
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install container and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends netcat-openbsd podman xxd

      - name: Install prek
        run: pipx install prek==0.5.0

      - name: Lint
        run: make lint

      - name: Build and test
        run: make test
