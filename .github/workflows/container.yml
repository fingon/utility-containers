name: container

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images after tests pass
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install container and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq netcat-openbsd podman skopeo xxd

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install prek
        run: pipx install prek==0.5.0

      - name: Verify native runner architecture
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          case "${TARGET_ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64)
              ;;
            *)
              printf 'runner is not native for %s: %s\n' "${TARGET_ARCH}" "$(uname -m)" >&2
              exit 1
              ;;
          esac

      - name: Lint
        run: make lint

      - name: Resolve nfcapd content key
        id: nfcapd-meta
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: ./ci/content-key.sh nfcapd "${TARGET_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Resolve Samba content key
        id: samba-meta
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: ./ci/content-key.sh samba "${TARGET_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Cache nfcapd image
        id: nfcapd-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/utility-nfcapd-${{ matrix.architecture }}.tar
          key: utility-nfcapd-${{ matrix.architecture }}-${{ steps.nfcapd-meta.outputs.key }}

      - name: Cache Samba image
        id: samba-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/utility-samba-${{ matrix.architecture }}.tar
          key: utility-samba-${{ matrix.architecture }}-${{ steps.samba-meta.outputs.key }}

      - name: Load or build nfcapd image
        env:
          NFCAPD_BASE_IMAGE: ${{ steps.nfcapd-meta.outputs.base_image }}
          NFCAPD_CONTENT_KEY: ${{ steps.nfcapd-meta.outputs.key }}
        run: |
          if [[ "${{ steps.nfcapd-cache.outputs.cache-hit }}" == true ]]; then
            podman load --input "$RUNNER_TEMP/utility-nfcapd-${{ matrix.architecture }}.tar"
          else
            make build-nfcapd
            podman save --output "$RUNNER_TEMP/utility-nfcapd-${{ matrix.architecture }}.tar" \
              localhost/utility-containers/nfcapd:debian
          fi

      - name: Test nfcapd image
        env:
          ENGINE: podman
          IMAGE: localhost/utility-containers/nfcapd:debian
          ITEST_DIAG_DIR: ${{ runner.temp }}/integration-diagnostics
        run: ./nfcapd/test-integration.sh

      - name: Load or build Samba image
        env:
          SAMBA_BASE_IMAGE: ${{ steps.samba-meta.outputs.base_image }}
          SAMBA_CONTENT_KEY: ${{ steps.samba-meta.outputs.key }}
        run: |
          if [[ "${{ steps.samba-cache.outputs.cache-hit }}" == true ]]; then
            podman load --input "$RUNNER_TEMP/utility-samba-${{ matrix.architecture }}.tar"
          else
            make build-samba
            podman save --output "$RUNNER_TEMP/utility-samba-${{ matrix.architecture }}.tar" \
              localhost/utility-containers/samba:debian
          fi

      - name: Test Samba image
        env:
          ENGINE: podman
          IMAGE: localhost/utility-containers/samba:debian
          ITEST_DIAG_DIR: ${{ runner.temp }}/integration-diagnostics
        run: ./samba/test-integration.sh

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-diagnostics-${{ matrix.architecture }}
          path: ${{ runner.temp }}/integration-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Record tested image metadata
        env:
          NFCAPD_CONTENT_KEY: ${{ steps.nfcapd-meta.outputs.key }}
          SAMBA_CONTENT_KEY: ${{ steps.samba-meta.outputs.key }}
        run: |
          printf 'nfcapd=%s\nsamba=%s\n' "$NFCAPD_CONTENT_KEY" "$SAMBA_CONTENT_KEY" \
            > "$RUNNER_TEMP/metadata-${{ matrix.architecture }}"

      - name: Upload tested images for publication
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish == true)
        uses: actions/upload-artifact@v7
        with:
          name: tested-images-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/utility-nfcapd-${{ matrix.architecture }}.tar
            ${{ runner.temp }}/utility-samba-${{ matrix.architecture }}.tar
            ${{ runner.temp }}/metadata-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish == true)
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq podman skopeo

      - name: Download tested images
        uses: actions/download-artifact@v8
        with:
          pattern: tested-images-*
          merge-multiple: true
          path: ${{ runner.temp }}/tested-images

      - name: Log in to GHCR
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Check whether publication is required
        id: publication
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/tested-images
          GITHUB_REPOSITORY: ${{ github.repository }}
          REGISTRY: ghcr.io
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: ./ci/check-publication.sh >> "$GITHUB_OUTPUT"

      - name: Push staging images and public manifests
        if: steps.publication.outputs.needed == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/tested-images
          ENGINE: podman
          GITHUB_REPOSITORY: ${{ github.repository }}
          REGISTRY: ghcr.io
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ./ci/publish-images.sh
