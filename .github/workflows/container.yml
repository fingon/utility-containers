name: container

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images after tests pass
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install container and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq netcat-openbsd podman skopeo xxd

      - name: Install prek
        run: pipx install prek==0.5.0

      - name: Lint
        run: make lint

      - name: Resolve nfcapd content key
        id: nfcapd-meta
        env:
          TARGET_ARCH: amd64
        run: ./ci/content-key.sh nfcapd "${TARGET_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Resolve Samba content key
        id: samba-meta
        env:
          TARGET_ARCH: amd64
        run: ./ci/content-key.sh samba "${TARGET_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Cache nfcapd image
        id: nfcapd-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/utility-nfcapd.tar
          key: utility-nfcapd-${{ steps.nfcapd-meta.outputs.key }}

      - name: Cache Samba image
        id: samba-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/utility-samba.tar
          key: utility-samba-${{ steps.samba-meta.outputs.key }}

      - name: Build uncached images
        env:
          NFCAPD_BASE_IMAGE: ${{ steps.nfcapd-meta.outputs.base_image }}
          NFCAPD_CONTENT_KEY: ${{ steps.nfcapd-meta.outputs.key }}
          SAMBA_BASE_IMAGE: ${{ steps.samba-meta.outputs.base_image }}
          SAMBA_CONTENT_KEY: ${{ steps.samba-meta.outputs.key }}
        run: |
          if [[ "${{ steps.nfcapd-cache.outputs.cache-hit }}" == true ]]; then
            podman load --input "$RUNNER_TEMP/utility-nfcapd.tar"
          else
            make build-nfcapd
            podman save --output "$RUNNER_TEMP/utility-nfcapd.tar" \
              localhost/utility-containers/nfcapd:alpine
          fi
          if [[ "${{ steps.samba-cache.outputs.cache-hit }}" == true ]]; then
            podman load --input "$RUNNER_TEMP/utility-samba.tar"
          else
            make build-samba
            podman save --output "$RUNNER_TEMP/utility-samba.tar" \
              localhost/utility-containers/samba:24.04
          fi

      - name: Test every candidate image
        env:
          ENGINE: podman
          NFCAPD_IMAGE: localhost/utility-containers/nfcapd:alpine
          SAMBA_IMAGE: localhost/utility-containers/samba:24.04
        run: |
          IMAGE="$NFCAPD_IMAGE" ./nfcapd/test-integration.sh
          IMAGE="$SAMBA_IMAGE" ./samba/test-integration.sh
